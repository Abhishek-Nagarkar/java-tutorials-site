name: Build and deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Pull lessons from the content repo (replaces the sample lessons).
      # Set repo variable CONTENT_REPO, e.g. your-user/java-tutorials-content.
      # If the content repo is private, also add secret CONTENT_REPO_TOKEN.
      - name: Check out content repo
        if: ${{ vars.CONTENT_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CONTENT_REPO }}
          token: ${{ secrets.CONTENT_REPO_TOKEN || github.token }}
          path: content

      - name: Use content repo as docs
        if: ${{ vars.CONTENT_REPO != '' }}
        run: |
          rm -rf src/content/docs
          mkdir -p src/content/docs
          cp -r content/. src/content/docs/
          rm -rf src/content/docs/.git src/content/docs/.github

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PROJECT_NAME }}
